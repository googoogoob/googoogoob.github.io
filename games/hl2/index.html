<!doctype html>
<html lang="en-us">

<head>
    <script src="coi-serviceworker.js"></script>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>web hl2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas.emscripten {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0px none;
            background-color: black;
        }

        /* ── Loading overlay ── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.6s ease;
            font-family: 'Courier New', monospace;
            color: #c8a96e;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-logo {
            width: 280px;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        #loading-status {
            font-size: 13px;
            margin-bottom: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #loading-bar-wrap {
            width: 320px;
            height: 5px;
            background: #2a2a2a;
            border-radius: 3px;
            overflow: hidden;
        }

        #loading-bar-fill {
            height: 100%;
            width: 0%;
            background: #c8a96e;
            transition: width 0.2s ease;
        }

        #loading-warn {
            margin-top: 22px;
            font-size: 11px;
            color: #555;
            max-width: 320px;
            text-align: center;
            line-height: 1.7;
        }

        /* Hidden compat elements */
        #spinner, #status, #progress, #controls, #output, #emscripten_logo {
            display: none !important;
        }

        /* ── Debug console ── */
        #debug-console {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.93);
            color: #d4d4d4;
            font: 12px/1.5 'Courier New', monospace;
            z-index: 99999;
            flex-direction: column;
        }

        #debug-console.visible {
            display: flex;
        }

        #debug-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #debug-toolbar span {
            color: #c8a96e;
            font-weight: bold;
            font-size: 13px;
            margin-right: 4px;
        }

        .dbg-btn {
            padding: 3px 10px;
            border-radius: 3px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #ccc;
            font: 11px 'Courier New', monospace;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dbg-btn:hover { background: #3a3a3a; }
        .dbg-btn.active { background: #444; border-color: #c8a96e; color: #c8a96e; }

        #dbg-filter {
            padding: 3px 8px;
            background: #222;
            border: 1px solid #444;
            color: #ccc;
            font: 11px 'Courier New', monospace;
            border-radius: 3px;
            flex: 1;
            min-width: 120px;
        }

        #dbg-count {
            margin-left: auto;
            color: #555;
            font-size: 11px;
            white-space: nowrap;
        }

        #debug-log {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .log-entry {
            display: flex;
            padding: 2px 12px;
            border-bottom: 1px solid #1e1e1e;
            gap: 10px;
            align-items: baseline;
        }
        .log-entry:hover { background: #1a1a1a; }

        .log-entry .ts {
            color: #555;
            font-size: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .log-entry .badge {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 2px;
            flex-shrink: 0;
            font-weight: bold;
            text-transform: uppercase;
        }

        .log-entry.type-log   .badge { background: #1e3a1e; color: #6bc46b; }
        .log-entry.type-warn  .badge { background: #3a2f00; color: #f0c040; }
        .log-entry.type-error .badge { background: #3a0000; color: #ff6b6b; }
        .log-entry.type-info  .badge { background: #001f3a; color: #64b5f6; }
        .log-entry.type-status .badge { background: #2a1f00; color: #c8a96e; }
        .log-entry.type-except .badge { background: #5a0000; color: #ff4444; }
        .log-entry.type-promise .badge { background: #3a003a; color: #ce93d8; }
        .log-entry.type-webgl .badge { background: #1a1a3a; color: #80cbc4; }

        .log-entry .msg {
            color: #d4d4d4;
            word-break: break-all;
            white-space: pre-wrap;
            flex: 1;
        }
        .log-entry.type-warn  .msg { color: #f0c040; }
        .log-entry.type-error .msg { color: #ff8080; }
        .log-entry.type-except .msg { color: #ff6b6b; }
        .log-entry.type-promise .msg { color: #ce93d8; }

        #debug-hint {
            padding: 5px 12px;
            background: #111;
            border-top: 1px solid #222;
            color: #444;
            font-size: 10px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <img id="loading-logo" src="assets/hl2.png" alt="Half-Life 2" />
        <div id="loading-status">Initializing...</div>
        <div id="loading-bar-wrap">
            <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-warn">
            Takes a while to load.<br>
            Map loading is also slow — this is normal.
        </div>
    </div>

    <!-- Hidden compat elements Emscripten expects to exist -->
    <a href="http://emscripten.org" style="display:none"><img id="emscripten_logo" src="assets/hl2.png" /></a>
    <div class="spinner" id="spinner"></div>
    <div id="status"></div>
    <span id="controls"></span>
    <progress value="0" max="100" id="progress" hidden="1"></progress>
    <textarea id="output" rows="8"></textarea>

    <!-- Game canvas -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- ── Debug console overlay ── -->
    <div id="debug-console">
        <div id="debug-toolbar">
            <span>⚙ HL2 DEBUG</span>
            <button class="dbg-btn active" data-filter="all">All</button>
            <button class="dbg-btn" data-filter="log">Log</button>
            <button class="dbg-btn" data-filter="warn">Warn</button>
            <button class="dbg-btn" data-filter="error">Error</button>
            <button class="dbg-btn" data-filter="except">Exception</button>
            <button class="dbg-btn" data-filter="status">Status</button>
            <input id="dbg-filter" type="text" placeholder="Search logs..." />
            <button class="dbg-btn" id="dbg-copy">Copy All</button>
            <button class="dbg-btn" id="dbg-download">⬇ Download</button>
            <button class="dbg-btn" id="dbg-clear">Clear</button>
            <button class="dbg-btn" id="dbg-close">✕ Close</button>
            <span id="dbg-count">0 entries</span>
        </div>
        <div id="debug-log"></div>
        <div id="debug-hint">
            Press <kbd style="color:#c8a96e">F8</kbd> or triple-tap to toggle · Logs auto-saved to localStorage · 
            <span id="dbg-storage-info"></span>
        </div>
    </div>

    <script>
    // ════════════════════════════════════════════════════════════════
    //  FULL DEBUG LOGGER — captures everything for Chromebook users
    // ════════════════════════════════════════════════════════════════

    (function() {
        'use strict';

        const MAX_ENTRIES = 2000;
        const LS_KEY      = 'hl2_debug_log';

        // In-memory log buffer
        let entries = [];
        let filterType = 'all';
        let filterText = '';
        let autoScroll  = true;

        // Load previous session
        try {
            const prev = localStorage.getItem(LS_KEY);
            if (prev) {
                const parsed = JSON.parse(prev);
                entries = parsed.slice(-MAX_ENTRIES);
                entries.forEach(e => e._fromPrev = true);
            }
        } catch(e) {}

        // ── DOM refs ──
        const dbgConsole = document.getElementById('debug-console');
        const dbgLog     = document.getElementById('debug-log');
        const dbgCount   = document.getElementById('dbg-count');
        const dbgFilter  = document.getElementById('dbg-filter');
        const dbgStorage = document.getElementById('dbg-storage-info');

        // ── Save to localStorage ──
        function persist() {
            try {
                // Only persist last 500 to avoid quota issues
                localStorage.setItem(LS_KEY, JSON.stringify(entries.slice(-500)));
                dbgStorage.textContent = entries.length + ' entries total';
            } catch(e) {}
        }

        // ── Render a single entry into the log DOM ──
        function entryVisible(e) {
            if (filterType !== 'all' && e.type !== filterType) return false;
            if (filterText && !e.msg.toLowerCase().includes(filterText)) return false;
            return true;
        }

        function buildRow(e) {
            const row = document.createElement('div');
            row.className = 'log-entry type-' + e.type;
            row.dataset.id = e.id;

            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.textContent = new Date(e.t).toISOString().slice(11, 23);

            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = e.type;

            const msg = document.createElement('span');
            msg.className = 'msg';
            msg.textContent = e.msg;

            row.appendChild(ts);
            row.appendChild(badge);
            row.appendChild(msg);
            return row;
        }

        function renderAll() {
            dbgLog.innerHTML = '';
            const visible = entries.filter(entryVisible);
            const frag = document.createDocumentFragment();
            visible.forEach(e => frag.appendChild(buildRow(e)));
            dbgLog.appendChild(frag);
            dbgCount.textContent = visible.length + ' / ' + entries.length + ' entries';
            if (autoScroll) dbgLog.scrollTop = dbgLog.scrollHeight;
        }

        function appendRow(e) {
            if (!entryVisible(e)) {
                dbgCount.textContent = entries.filter(entryVisible).length + ' / ' + entries.length + ' entries';
                return;
            }
            const row = buildRow(e);
            dbgLog.appendChild(row);
            dbgCount.textContent = dbgLog.children.length + ' / ' + entries.length + ' entries';
            if (autoScroll) dbgLog.scrollTop = dbgLog.scrollHeight;
        }

        // ── Core log function ──
        let _idCounter = 0;
        function addLog(type, ...args) {
            // Serialize args
            const msg = args.map(a => {
                if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
                if (typeof a === 'object') {
                    try { return JSON.stringify(a); } catch(e) { return String(a); }
                }
                return String(a);
            }).join(' ');

            const entry = { id: ++_idCounter, t: Date.now(), type, msg };
            entries.push(entry);
            if (entries.length > MAX_ENTRIES) entries.shift();

            appendRow(entry);
            persist();
        }

        // ── Intercept console methods ──
        const _console = {
            log:   console.log.bind(console),
            warn:  console.warn.bind(console),
            error: console.error.bind(console),
            info:  console.info.bind(console),
            debug: console.debug ? console.debug.bind(console) : console.log.bind(console),
        };

        console.log = function(...a)   { _console.log(...a);   addLog('log',  ...a); };
        console.warn = function(...a)  { _console.warn(...a);  addLog('warn', ...a); };
        console.error = function(...a) { _console.error(...a); addLog('error',...a); };
        console.info = function(...a)  { _console.info(...a);  addLog('info', ...a); };
        console.debug = function(...a) { _console.debug(...a); addLog('log',  ...a); };

        // ── Global error handler ──
        window.addEventListener('error', function(ev) {
            const msg = [
                ev.message,
                ev.filename ? 'at ' + ev.filename + ':' + ev.lineno + ':' + ev.colno : '',
                ev.error ? (ev.error.stack || '') : ''
            ].filter(Boolean).join('\n');
            addLog('except', msg);
        }, true);

        // ── Unhandled promise rejections ──
        window.addEventListener('unhandledrejection', function(ev) {
            const reason = ev.reason;
            const msg = reason instanceof Error
                ? (reason.stack || reason.message)
                : String(reason);
            addLog('promise', 'Unhandled Promise Rejection: ' + msg);
        });

        // ── WebGL context events ──
        const canvas = document.getElementById('canvas');
        if (canvas) {
            canvas.addEventListener('webglcontextlost', ev => {
                addLog('webgl', 'WebGL context LOST — ' + JSON.stringify({
                    statusMessage: ev.statusMessage
                }));
                ev.preventDefault();
            });
            canvas.addEventListener('webglcontextrestored', () => {
                addLog('webgl', 'WebGL context restored');
            });

            // Wrap getExtension to log WEBGL_debug_shaders / KHR_parallel_shader_compile etc.
            const _getContext = canvas.getContext.bind(canvas);
            canvas.getContext = function(type, attrs) {
                const ctx = _getContext(type, attrs);
                if (ctx) addLog('webgl', 'WebGL context created: ' + type);
                return ctx;
            };
        }

        // ── Expose addLog globally so Module.setStatus can use it ──
        window._hl2Log = addLog;

        // ── UI: toggle ──
        function showConsole()  { dbgConsole.classList.add('visible');    renderAll(); }
        function hideConsole()  { dbgConsole.classList.remove('visible'); }
        function toggleConsole(){ dbgConsole.classList.contains('visible') ? hideConsole() : showConsole(); }

        // F8 key
        window.addEventListener('keydown', ev => {
            if (ev.key === 'F8') { ev.preventDefault(); toggleConsole(); }
        });

        // Triple-tap on mobile
        let tapCount = 0, tapTimer;
        document.addEventListener('touchend', () => {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => {
                if (tapCount >= 3) toggleConsole();
                tapCount = 0;
            }, 400);
        });

        // ── UI: filter buttons ──
        document.querySelectorAll('.dbg-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dbg-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterType = btn.dataset.filter;
                renderAll();
            });
        });

        // ── UI: text search ──
        dbgFilter.addEventListener('input', () => {
            filterText = dbgFilter.value.toLowerCase();
            renderAll();
        });

        // ── UI: copy ──
        document.getElementById('dbg-copy').addEventListener('click', () => {
            const text = entries.map(e =>
                new Date(e.t).toISOString().slice(11,23) + ' [' + e.type.toUpperCase() + '] ' + e.msg
            ).join('\n');
            navigator.clipboard.writeText(text).then(
                () => { const b = document.getElementById('dbg-copy'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy All',1500); },
                () => { alert('Clipboard failed — select text manually'); }
            );
        });

        // ── UI: download ──
        document.getElementById('dbg-download').addEventListener('click', () => {
            const text = entries.map(e =>
                new Date(e.t).toISOString().slice(11,23) + ' [' + e.type.toUpperCase() + '] ' + e.msg
            ).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'hl2_debug_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        // ── UI: clear ──
        document.getElementById('dbg-clear').addEventListener('click', () => {
            entries = [];
            _idCounter = 0;
            dbgLog.innerHTML = '';
            dbgCount.textContent = '0 entries';
            try { localStorage.removeItem(LS_KEY); } catch(e){}
        });

        // ── UI: close ──
        document.getElementById('dbg-close').addEventListener('click', hideConsole);

        // ── UI: auto-scroll toggle ──
        dbgLog.addEventListener('scroll', () => {
            const atBottom = dbgLog.scrollHeight - dbgLog.scrollTop - dbgLog.clientHeight < 40;
            autoScroll = atBottom;
        });

        // If previous session data exists, auto-open the console and show a banner
        const hadPrevSession = entries.length > 0;
        if (hadPrevSession) {
            // Insert a visual separator at the top
            entries.unshift({
                id: ++_idCounter, t: Date.now(), type: 'status',
                msg: '━━━ PREVIOUS SESSION LOG (' + entries.length + ' entries) — scroll down for current session ━━━'
            });
            // Auto-open so they see it immediately on reload
            setTimeout(() => showConsole(), 300);
        }

        addLog('status', 'Debug logger active. F8 or triple-tap to open. Capturing: console.log/warn/error/info, JS errors, promise rejections, WebGL events.');

    })();
    </script>

    <script type="text/javascript">
        var statusElement    = document.getElementById("status");
        var progressElement  = document.getElementById("progress");
        var spinnerElement   = document.getElementById("spinner");
        var canvasElement    = document.getElementById("canvas");
        var outputElement    = document.getElementById("output");

        // Overlay elements
        var overlayEl        = document.getElementById("loading-overlay");
        var statusTextEl     = document.getElementById("loading-status");
        var barFillEl        = document.getElementById("loading-bar-fill");

        if (outputElement) outputElement.value = "";

        canvasElement.widthNative  = screen.availWidth;
        canvasElement.heightNative = screen.availHeight;

        var Module = {
            print(...args) {
                // Route Emscripten stdout to the debug logger too
                const text = args.join(" ");
                console.log('[EM]', text);
                if (outputElement) {
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },

            canvas: canvasElement,

            setStatus(text) {
                Module.setStatus.last ??= { time: Date.now(), text: "" };
                if (text === Module.setStatus.last.text) return;

                var m   = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;

                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;

                // Log every status update to the debug panel
                if (window._hl2Log) window._hl2Log('status', text || '(loading complete)');

                if (m) {
                    var pct = (parseInt(m[2]) / parseInt(m[4])) * 100;
                    if (barFillEl)   barFillEl.style.width = pct + "%";
                    if (statusTextEl) statusTextEl.textContent = m[1].trim();
                    progressElement.value = parseInt(m[2]) * 100;
                    progressElement.max   = parseInt(m[4]) * 100;
                } else {
                    progressElement.value = null;
                    progressElement.max   = null;
                    if (statusTextEl) statusTextEl.textContent = text || "Ready";

                    if (!text) {
                        if (barFillEl) barFillEl.style.width = "100%";
                        setTimeout(() => { if (overlayEl) overlayEl.classList.add("hidden"); }, 300);
                        setTimeout(() => { if (overlayEl) overlayEl.remove(); }, 1000);
                    }
                }
            },

            totalDependencies: 0,

            monitorRunDependencies(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(
                    left
                        ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")"
                        : "All downloads complete."
                );
            },
        };

        Module.setStatus("Downloading...");

        window.onerror = (event) => {
            // Already caught by the global error listener above, but belt-and-suspenders:
            Module.setStatus("Exception thrown, see debug console (F8)");
            Module.setStatus = (text) => {
                if (text && window._hl2Log) window._hl2Log('except', '[post-exception status] ' + text);
            };
        };
    </script>

    <script async type="text/javascript" src="hl2_launcher.js"></script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZRPZ3P6WM2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-ZRPZ3P6WM2');
    </script>

</body>
</html>
