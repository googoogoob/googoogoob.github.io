<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZRPZ3P6WM2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-ZRPZ3P6WM2');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hl2 launcher</title>
    <style>
        /* Base Page Setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a; 
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Styling for your image */
        .launcher-img {
            max-width: 300px; /* Adjust this to make the logo bigger or smaller */
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 157, 0, 0.5));
        }

        h1 {
            color: #ff9d00;
            font-size: 3rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        /* The MEGA Button */
        .launch-button {
            display: inline-block;
            background-color: #ff9d00;
            color: black;
            padding: 60px 120px; /* Slightly adjusted to fit screen better with image */
            font-size: 4rem;    
            font-weight: 900;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 20px 0 #b36e00, 0 30px 50px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-align: center;
            border: 4px solid #000;
        }

        .launch-button:hover {
            background-color: #ffad33;
            transform: translateY(-5px);
            box-shadow: 0 25px 0 #b36e00, 0 40px 60px rgba(0,0,0,0.6);
        }

        .launch-button:active {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #b36e00, 0 10px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>
    <img src="./hl2/assets/hl2.png" alt="HL2 Logo" class="launcher-img">
    
    <a href="https://tuffness.pages.dev" target="_blank" class="launch-button">button press yes</a>
</body>

</html>
