<html lang="en">

<head>

    <script>

    <!-- ===== OVERLAY CONSOLE (inject before everything) ===== -->
    <script>
        (function () {
            // State
            var logs = [];
            var collapsed = false;
            var dragging = false, dragOffX = 0, dragOffY = 0;

            // Build UI
            var panel = document.createElement('div');
            panel.id = '__oc';
            panel.style.cssText = [
                'position:fixed', 'bottom:12px', 'right:12px', 'z-index:2147483647',
                'width:420px', 'max-height:320px', 'display:flex', 'flex-direction:column',
                'background:#0d0d0d', 'border:1px solid #333', 'border-radius:8px',
                'font-family:monospace', 'font-size:12px', 'box-shadow:0 4px 24px #000a',
                'user-select:none', 'resize:horizontal', 'overflow:hidden', 'min-width:220px'
            ].join(';');

            // Header
            var hdr = document.createElement('div');
            hdr.style.cssText = 'display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1a1a1a;cursor:move;border-radius:8px 8px 0 0;flex-shrink:0;';
            hdr.innerHTML = '<span style="color:#ff5f57;font-size:9px">●</span><span style="color:#febc2e;font-size:9px">●</span><span style="color:#28c840;font-size:9px">●</span><span style="color:#888;flex:1;font-size:11px;padding-left:4px;">Console</span>';

            var btnClear = document.createElement('button');
            btnClear.textContent = 'Clear';
            btnClear.style.cssText = 'background:#2a2a2a;color:#ccc;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;';
            btnClear.onclick = function (e) {e.stopPropagation(); logs = []; renderLogs();};

            var btnToggle = document.createElement('button');
            btnToggle.textContent = '▼';
            btnToggle.style.cssText = 'background:#2a2a2a;color:#ccc;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;';
            btnToggle.onclick = function (e) {
                e.stopPropagation();
                collapsed = !collapsed;
                body.style.display = collapsed ? 'none' : 'flex';
                btnToggle.textContent = collapsed ? '▲' : '▼';
                panel.style.maxHeight = collapsed ? 'none' : '320px';
            };

            hdr.appendChild(btnClear);
            hdr.appendChild(btnToggle);

            // Body
            var body = document.createElement('div');
            body.style.cssText = 'flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;';

            panel.appendChild(hdr);
            panel.appendChild(body);

            // Render
            function renderLogs() {
                body.innerHTML = '';
                logs.forEach(function (l) {
                    var row = document.createElement('div');
                    row.style.cssText = 'padding:2px 8px;border-bottom:1px solid #1a1a1a;white-space:pre-wrap;word-break:break-all;line-height:1.5;color:' + l.color + ';';
                    row.textContent = l.ts + ' ' + l.prefix + ' ' + l.text;
                    body.appendChild(row);
                });
                body.scrollTop = body.scrollHeight;
            }

            function addLog(prefix, color, args) {
                var ts = new Date().toTimeString().slice(0, 8);
                var text;
                try {
                    text = Array.from(args).map(function (a) {
                        if (a instanceof Error) return a.stack || a.message;
                        if (typeof a === 'object') try {return JSON.stringify(a, null, 2);} catch (e) {return String(a);}
                        return String(a);
                    }).join(' ');
                } catch (e) {text = '[unserializable]';}
                logs.push({ts: ts, prefix: prefix, color: color, text: text});
                if (logs.length > 500) logs.shift(); // cap
                renderLogs();
            }

            // Intercept console
            var _log = console.log.bind(console);
            var _warn = console.warn.bind(console);
            var _error = console.error.bind(console);
            var _info = console.info.bind(console);
            var _debug = console.debug.bind(console);

            console.log = function () {_log.apply(console, arguments); addLog('[LOG]', '#ccc', arguments);};
            console.warn = function () {_warn.apply(console, arguments); addLog('[WARN]', '#febc2e', arguments);};
            console.error = function () {_error.apply(console, arguments); addLog('[ERR]', '#ff5f57', arguments);};
            console.info = function () {_info.apply(console, arguments); addLog('[INFO]', '#58a6ff', arguments);};
            console.debug = function () {_debug.apply(console, arguments); addLog('[DBG]', '#888', arguments);};

            // Global errors
            window.addEventListener('error', function (e) {
                addLog('[ERR]', '#ff5f57', [e.message + ' (' + (e.filename || '?') + ':' + e.lineno + ')']);
            });
            window.addEventListener('unhandledrejection', function (e) {
                addLog('[ERR]', '#ff5f57', ['Unhandled Promise: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason))]);
            });

            // Drag
            hdr.addEventListener('mousedown', function (e) {
                dragging = true;
                var r = panel.getBoundingClientRect();
                dragOffX = e.clientX - r.left;
                dragOffY = e.clientY - r.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', function () {dragging = false; document.removeEventListener('mousemove', onMove);}, {once: true});
            });
            function onMove(e) {
                if (!dragging) return;
                panel.style.left = (e.clientX - dragOffX) + 'px';
                panel.style.top = (e.clientY - dragOffY) + 'px';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
            }

            // Touch drag
            hdr.addEventListener('touchstart', function (e) {
                var t = e.touches[0];
                var r = panel.getBoundingClientRect();
                dragOffX = t.clientX - r.left; dragOffY = t.clientY - r.top;
                document.addEventListener('touchmove', onTouchMove, {passive: false});
                document.addEventListener('touchend', function () {document.removeEventListener('touchmove', onTouchMove);}, {once: true});
            });
            function onTouchMove(e) {
                e.preventDefault();
                var t = e.touches[0];
                panel.style.left = (t.clientX - dragOffX) + 'px';
                panel.style.top = (t.clientY - dragOffY) + 'px';
                panel.style.right = 'auto'; panel.style.bottom = 'auto';
            }

            // Mount after DOM ready
            function mount() {document.body ? document.body.appendChild(panel) : document.addEventListener('DOMContentLoaded', mount);}
            mount();

            // Expose global for manual use
            window.__console = {logs: logs, clear: function () {logs = []; renderLogs();}};
        })();
    </script>
    <!-- ===== END OVERLAY CONSOLE ===== -->

    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/buckshot-roulette/index.html">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Goob 360: Buckshot Roulette</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="gfavicon.png">
    <link rel="apple-touch-icon" href="buckshot-roulette.apple-touch-icon.png" />
</head>

<body>
    <script src="main.js"></script>
    <div id="loading-text"
        style="color: white; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...
    </div>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>
    <noscript> Your browser does not support JavaScript. </noscript>
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="buckshot-roulette.png"
            alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>
    <script src="buckshot-roulette.js"></script>
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "ensureCrossOriginIsolationHeaders": false,
            "executable": "buckshot-roulette",
            "experimentalVK": false,
            "fileSizes": {
                "buckshot-roulette.pck": 344705792,
                "buckshot-roulette.wasm": 43444261
            },
            "focusCanvas": false,
            "gdextensionLibs": []
        };
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        function run() {
            const loadingText = document.getElementById('loading-text');
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            loadingText.remove();
            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }
            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });
            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),
                    ]).then(() => {
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        };
        window.godotRunStart = run;
    </script>
</body>

</html>
