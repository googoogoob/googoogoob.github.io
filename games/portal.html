<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal</title>
    <style>
        /* Remove default browser padding/margins */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Make the iframe fill the entire viewport */
        .fullscreen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<script>
    function ABBlank(){
      if (true) {
        let inFrame
        try {
            inFrame = window !== top
        } catch (e) {
            inFrame = true
        }
        if (!inFrame && !navigator.userAgent.includes("Firefox")) {
            const popup = open("about:blank", "_blank")  
            if (!popup || popup.closed) {
                alert("Please allow pop-ups to use this launcher")
            } else {
                const doc = popup.document
                const iframe = doc.createElement("iframe")
                const style = iframe.style
                const link = doc.createElement("link")
                const name = localStorage.getItem("name") || "Dashboard";
                const icon = localStorage.getItem("icon") || "https://cdn.jsdelivr.net/gh/googoogoob/GGLauncher/favicon.ico";
                doc.title = name;
                link.rel = "icon";
                link.href = icon;
                iframe.src = "https://pwebport.pages.dev/"
                style.position = "fixed"
                style.top = style.bottom = style.left = style.right = 0
                style.border = style.outline = "none"
                style.width = style.height = "100%"
                doc.head.appendChild(link);
                doc.body.appendChild(iframe)
                location.replace("https://googoogoob.github.io")
            }
        }
      }
    }
    ABBlank();
</script>

</body>
</html>
