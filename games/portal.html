<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal</title>
    <style>
        /* Remove default browser padding/margins */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Make the iframe fill the entire viewport */
        .fullscreen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <meta http-equiv="refresh" content="0; url=https://pwebport.pages.dev/">
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://pwebport.pages.dev/">click here</a>.</p>
    <script>
        window.location.href = 'https://pwebport.pages.dev/';
    </script>
</body>
</html>
